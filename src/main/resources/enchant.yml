drill:
  enabled: true # true — включить чары, false — отключить выдачу и эффект.
  name: "&7Бур" # Название чар; на предметах оно отображается серым.
  max-level: 2 # Максимальный уровень этих чар; значения эффектов по уровням указаны в values.
  weight: 10 # Вес выбора, НЕ проценты: 20 выбирается вдвое чаще 10; 0 — убрать из случайного выбора.
  chance: 100.0 # Шанс выдачи ПОСЛЕ выбора по weight, 0–100%; не шанс работы эффекта. Общий шанс — в config.yml.
  target: TOOLS_NO_HOE # Кирки, топоры, лопаты и ножницы; мотыги исключены.
  values: [80, 100] # Шанс работы Бура: I — 80%, II — 100%; [100, 100] — всегда 3х3. Это не размер области.
# Пингер: предупреждает о прочности. Порог в config.yml, действия в messages.yml.
pinger:
  enabled: true # true — включить чары, false — отключить выдачу и эффект.
  name: "&7Пингер" # Название чар; на предметах оно отображается серым.
  max-level: 1 # Максимальный уровень этих чар; значения эффектов по уровням указаны в values.
  weight: 10 # Вес выбора, НЕ проценты: 20 выбирается вдвое чаще 10; 0 — убрать из случайного выбора.
  chance: 100.0 # Шанс выдачи ПОСЛЕ выбора по weight, 0–100%; не шанс работы эффекта. Общий шанс — в config.yml.
  target: TOOLS # Кирки, топоры, лопаты, мотыги и ножницы. Пингер принудительно ограничен инструментами, даже при другом target.
  values: [100] # Резерв, не используется. Порог прочности: pinger.remaining-percent в config.yml.
# Нерушимость: отменяет расход прочности предмета при наличии чар.
unbreakable:
  enabled: true # true — включить чары, false — отключить выдачу и эффект.
  name: "&7Нерушимость" # Название чар; на предметах оно отображается серым.
  max-level: 1 # Максимальный уровень этих чар; значения эффектов по уровням указаны в values.
  weight: 10 # Вес выбора, НЕ проценты: 20 выбирается вдвое чаще 10; 0 — убрать из случайного выбора.
  chance: 100.0 # Шанс выдачи ПОСЛЕ выбора по weight, 0–100%; не шанс работы эффекта. Общий шанс — в config.yml.
  target: TOOLS # Кирки, топоры, лопаты, мотыги и ножницы.
  values: [100] # Резерв, не используется. При наличии чар расход прочности отменяется всегда.
# Опытный: values — бонус опыта в процентах. Берётся наибольший бонус рук и брони, без сложения.
experienced:
  enabled: true # true — включить чары, false — отключить выдачу и эффект.
  name: "&7Опытный" # Название чар; на предметах оно отображается серым.
  max-level: 5 # Максимальный уровень этих чар; значения эффектов по уровням указаны в values.
  weight: 10 # Вес выбора, НЕ проценты: 20 выбирается вдвое чаще 10; 0 — убрать из случайного выбора.
  chance: 100.0 # Шанс выдачи ПОСЛЕ выбора по weight, 0–100%; не шанс работы эффекта. Общий шанс — в config.yml.
  target: ALL # Инструменты, оружие, броня, элитры, щит, удочка и огниво.
  values: [10, 15, 25, 35, 50] # Бонус опыта: I +10%, II +15%, III +25%, IV +35%, V +50%. Это не шанс.
# Вампиризм: values — шанс в процентах восстановить 1 сердце при прямом ударе игрока по игроку.
vampirism:
  enabled: true # true — включить чары, false — отключить выдачу и эффект.
  name: "&7Вампиризм" # Название чар; на предметах оно отображается серым.
  max-level: 1 # Максимальный уровень этих чар; значения эффектов по уровням указаны в values.
  weight: 10 # Вес выбора, НЕ проценты: 20 выбирается вдвое чаще 10; 0 — убрать из случайного выбора.
  chance: 100.0 # Шанс выдачи ПОСЛЕ выбора по weight, 0–100%; не шанс работы эффекта. Общий шанс — в config.yml.
  target: WEAPONS # Мечи, топоры, луки, арбалеты и трезубцы; Вампиризм работает только при прямом ударе.
  values: [10] # Шанс 10% восстановить 1 сердце при прямом ударе игрока по игроку; 100 — каждый удар.
# Автоплавка: преобразует выпавшие предметы по рецептам печи, без топлива.
smelting:
  enabled: true # true — включить чары, false — отключить выдачу и эффект.
  name: "&7Автоплавка" # Название чар; на предметах оно отображается серым.
  max-level: 1 # Максимальный уровень этих чар; значения эффектов по уровням указаны в values.
  weight: 10 # Вес выбора, НЕ проценты: 20 выбирается вдвое чаще 10; 0 — убрать из случайного выбора.
  chance: 100.0 # Шанс выдачи ПОСЛЕ выбора по weight, 0–100%; не шанс работы эффекта. Общий шанс — в config.yml.
  target: TOOLS # Кирки, топоры, лопаты, мотыги и ножницы.
  values: [100] # Резерв, не используется. Добыча переплавляется всегда, если есть рецепт печи.
# Телепатия: переносит добычу в инвентарь. При нехватке места остаток выпадает на землю.
telepathy:
  enabled: true # true — включить чары, false — отключить выдачу и эффект.
  name: "&7Телепатия" # Название чар; на предметах оно отображается серым.
  max-level: 1 # Максимальный уровень этих чар; значения эффектов по уровням указаны в values.
  weight: 10 # Вес выбора, НЕ проценты: 20 выбирается вдвое чаще 10; 0 — убрать из случайного выбора.
  chance: 100.0 # Шанс выдачи ПОСЛЕ выбора по weight, 0–100%; не шанс работы эффекта. Общий шанс — в config.yml.
  target: TOOLS # Кирки, топоры, лопаты, мотыги и ножницы.
  values: [100] # Резерв, не используется. Добыча всегда переносится в инвентарь, пока есть место.
# Лаваход: временно заменяет лаву под игроком обсидианом в области 3х3. Время — в config.yml.
lavawalker:
  enabled: true # true — включить чары, false — отключить выдачу и эффект.
  name: "&7Лаваход" # Название чар; на предметах оно отображается серым.
  max-level: 1 # Максимальный уровень этих чар; значения эффектов по уровням указаны в values.
  weight: 10 # Вес выбора, НЕ проценты: 20 выбирается вдвое чаще 10; 0 — убрать из случайного выбора.
  chance: 100.0 # Шанс выдачи ПОСЛЕ выбора по weight, 0–100%; не шанс работы эффекта. Общий шанс — в config.yml.
  target: BOOTS # Только ботинки.
  values: [100] # Резерв, не используется. Время обсидиана: lava.duration-ticks в config.yml.
# Посев: заново сажает зрелую культуру, расходуя подходящее семя из инвентаря игрока.
sowing:
  enabled: true # true — включить чары, false — отключить выдачу и эффект.
  name: "&7Посев" # Название чар; на предметах оно отображается серым.
  max-level: 1 # Максимальный уровень этих чар; значения эффектов по уровням указаны в values.
  weight: 10 # Вес выбора, НЕ проценты: 20 выбирается вдвое чаще 10; 0 — убрать из случайного выбора.
  chance: 100.0 # Шанс выдачи ПОСЛЕ выбора по weight, 0–100%; не шанс работы эффекта. Общий шанс — в config.yml.
  target: HOES # Только мотыги.
  values: [100] # Резерв, не используется. Пересадка зрелой культуры требует семя в инвентаре.
# Дровосек: ломает связанные брёвна вверх, включая постройки. Лимит — limits.tree-blocks в config.yml.
lumberjack:
  enabled: true # true — включить чары, false — отключить выдачу и эффект.
  name: "&7Дровосек" # Название чар; на предметах оно отображается серым.
  max-level: 1 # Максимальный уровень этих чар; значения эффектов по уровням указаны в values.
  weight: 10 # Вес выбора, НЕ проценты: 20 выбирается вдвое чаще 10; 0 — убрать из случайного выбора.
  chance: 100.0 # Шанс выдачи ПОСЛЕ выбора по weight, 0–100%; не шанс работы эффекта. Общий шанс — в config.yml.
  target: AXES # Только топоры.
  values: [100] # Резерв, не используется. Лимит брёвен: limits.tree-blocks в config.yml.
