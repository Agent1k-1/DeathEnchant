# Настройки кастомных чар. После изменения выполните /deathe reload.
# Имена секций (drill, pinger и т. д.) — ID для команды /deathe give.
# Не переименовывайте ID: обработчики эффектов привязаны к ним.
#
# enabled: true — чары включены; false — исключены из выдачи и обработки.
# name: отображаемое название; поддерживаются цветовые коды &, например &d.
# max-level: максимальный уровень, целое число не меньше 1.
# weight: относительный вес случайного выбора среди подходящих чар.
#   Это не процент: вес 20 выбирается вдвое чаще веса 10.
#   0 исключает случайный выбор, но оставляет выдачу командой.
# target: предметы для случайного зачарования и применения книги в наковальне.
#   TOOLS — кирки, топоры, лопаты, мотыги и ножницы.
#   TOOLS_NO_HOE — те же инструменты, кроме мотыг.
#   WEAPONS — мечи, топоры, луки, арбалеты и трезубцы.
#   BOOTS — ботинки; HOES — мотыги; AXES — топоры.
#   ALL — инструменты, оружие, броня, элитры, щит, удочка и огниво.
# values: значения по уровням: первое для I, второе для II и так далее.
#   Если уровней больше значений, используется последнее значение.
#   Сейчас читается только у drill, experienced и vampirism.
#   Для остальных чар [100] — резерв; изменение не меняет действие эффекта.
# description: список строк описания на книге и зачарованном предмете.
#   Можно добавить любое число строк с тем же отступом, в том числе пустые.
#   Поддерживаются цвета & и подстановка {level} — числовой уровень чар.
#   Пример строки: - "&7Уровень: {level}"

# Бур: разрушает плоскость 3х3. values — шанс срабатывания в процентах: I — 80%, II — 100%.
drill:
  enabled: true
  name: "&dБур"
  max-level: 2
  weight: 10
  target: TOOLS_NO_HOE
  values: [80, 100]
  description:
    - "&7Бур: особое зачарование"
# Пингер: предупреждает о прочности. Порог в config.yml, действия в messages.yml.
pinger:
  enabled: true
  name: "&dПингер"
  max-level: 1
  weight: 10
  target: ALL
  values: [100]
  description:
    - "&7Пингер: особое зачарование"
# Нерушимость: отменяет расход прочности предмета при наличии чар.
unbreakable:
  enabled: true
  name: "&dНерушимость"
  max-level: 1
  weight: 10
  target: TOOLS
  values: [100]
  description:
    - "&7Нерушимость: особое зачарование"
# Опытный: values — бонус опыта в процентах. Берётся наибольший бонус рук и брони, без сложения.
experienced:
  enabled: true
  name: "&dОпытный"
  max-level: 5
  weight: 10
  target: ALL
  values: [10, 15, 25, 35, 50]
  description:
    - "&7Опытный: особое зачарование"
# Вампиризм: values — шанс в процентах восстановить 1 сердце при прямом ударе игрока по игроку.
vampirism:
  enabled: true
  name: "&dВампиризм"
  max-level: 1
  weight: 10
  target: WEAPONS
  values: [10]
  description:
    - "&7Вампиризм: особое зачарование"
# Автоплавка: преобразует выпавшие предметы по рецептам печи, без топлива.
smelting:
  enabled: true
  name: "&dАвтоплавка"
  max-level: 1
  weight: 10
  target: TOOLS
  values: [100]
  description:
    - "&7Автоплавка: особое зачарование"
# Телепатия: переносит добычу в инвентарь. При нехватке места остаток выпадает на землю.
telepathy:
  enabled: true
  name: "&dТелепатия"
  max-level: 1
  weight: 10
  target: TOOLS
  values: [100]
  description:
    - "&7Телепатия: особое зачарование"
# Лаваход: временно заменяет лаву под игроком обсидианом в области 3х3. Время — в config.yml.
lavawalker:
  enabled: true
  name: "&dЛаваход"
  max-level: 1
  weight: 10
  target: BOOTS
  values: [100]
  description:
    - "&7Лаваход: особое зачарование"
# Посев: заново сажает зрелую культуру, расходуя подходящее семя из инвентаря игрока.
sowing:
  enabled: true
  name: "&dПосев"
  max-level: 1
  weight: 10
  target: HOES
  values: [100]
  description:
    - "&7Посев: особое зачарование"
# Дровосек: ломает связанные брёвна вверх, включая постройки. Лимит — limits.tree-blocks в config.yml.
lumberjack:
  enabled: true
  name: "&dДровосек"
  max-level: 1
  weight: 10
  target: AXES
  values: [100]
  description:
    - "&7Дровосек: особое зачарование"
