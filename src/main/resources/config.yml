# Основные настройки DeathEnchants. После изменения выполните /deathe reload.
# Отступы задавайте пробелами, не табуляцией. Шансы указываются от 0 до 100.

# Зачарование предметов в столе.
table:
  # Шанс добавить случайные кастомные чары при обычном зачаровании.
  # 0 — никогда, 100 — при каждом зачаровании подходящего предмета.
  # На отдельное меню Shift + ПКМ этот шанс не влияет.
  chance: 30.0
  # Стоимость трёх предложений меню Shift + ПКМ в уровнях опыта.
  # Указанное число уровней списывается полностью; лазурита нужно 1, 2 и 3 шт.
  # Используются первые три значения. Книжные полки в этом меню не учитываются.
  levels: [8, 16, 24]

# Появление одной случайной книги при генерации лута.
loot:
  # Общая вероятность добавления книги в подходящую таблицу лута, в процентах.
  chance: 12.0
  # [] — все таблицы лута, а не только сундуки данжей.
  # Для ограничения перечислите полные ключи, например:
  # tables:
  #   - minecraft:chests/simple_dungeon
  #   - minecraft:chests/abandoned_mineshaft
  tables: []

# Максимальные уровни ванильных чар при объединении в наковальне.
# Ключи — ванильные ID без minecraft:. Можно добавлять другие ID.
# Одинаковые уровни повышаются на один: эффективность V + V = VI, вплоть до X.
# При разных уровнях берётся больший, в пределах максимума.
# Стол выдаёт обычные ванильные уровни. Неуказанные чары имеют ванильный максимум.
# Допустимый диапазон — 1–255. На уже зачарованные вещи настройки не влияют.
vanilla-levels:
  # Эффективность.
  efficiency: 10
  # Прочность.
  unbreaking: 5
  # Острота.
  sharpness: 6

limits:
  # Максимум связанных брёвен для Дровосека, включая исходное. Диапазон 1–1024.
  # Обрабатываются также брёвна построек, если они связаны с исходным блоком.
  tree-blocks: 128
  # Зарезервировано: текущая реализация не читает этот параметр.
  # Бур всегда обрабатывает плоскость 3х3, включая исходный блок.
  vein-blocks: 9

pinger:
  # Порог оставшейся прочности в процентах от максимальной, от 0 до 100.
  # Предупреждение срабатывает при пересечении порога сверху вниз.
  # Текст и звук задаются в секции pinger файла messages.yml.
  remaining-percent: 10.0

lava:
  # Время до возврата обсидиана Лавахода в лаву, в серверных тиках.
  # 20 тиков ≈ 1 секунда при нормальном TPS; 100 тиков ≈ 5 секунд.
  duration-ticks: 100
