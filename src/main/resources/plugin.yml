# Служебное описание плагина для Paper. Изменения требуют перезапуска сервера.
# name — имя плагина; version — версия; main — полный путь к главному Java-классу.
# main и api-version должны соответствовать исходному коду и целевому API.
# author — автор. commands — зарегистрированные команды; aliases — сокращения.
# permissions — права доступа. default: op выдаёт право операторам сервера.
# Для обычной настройки используйте config.yml и enchant.yml.
name: DeathEnchants
version: 1.0.4
main: com.agent1k.deathenchants.DeathEnchants
api-version: '1.20'
author: Agent1k
commands:
  deathenchants:
    aliases: [deathe]
    description: Управление чарами
permissions:
  deathenchants.admin:
    default: op
